<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f2ec" />

    <!-- Primary SEO -->
    <title>Gaze Optics — Precision Eye Care &amp; Premium Eyewear Studio</title>
    <meta
      name="description"
      content="Gaze Optics is your local optical boutique — comprehensive eye exams, precision lenses, and hand-picked premium frames. Visit our store for a personalized fitting experience."
    />
    <meta
      name="keywords"
      content="optical store, eye testing, eye exam, prescription glasses, sunglasses, contact lenses, eyewear, gaze optics"
    />
    <meta name="robots" content="index, follow" />
    <!-- Live at GitHub Pages — replace with your custom domain if you add one -->
    <link rel="canonical" href="https://minatolun-dotcom.github.io/gazeoptics/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!-- Early connections to external services used on the page (maps embed, WhatsApp) -->
    <link rel="preconnect" href="https://www.google.com" crossorigin />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.google.com" />
    <link rel="dns-prefetch" href="https://wa.me" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="business.business" />
    <meta property="og:title" content="Gaze Optics — Precision Eye Care &amp; Premium Eyewear Studio" />
    <meta
      property="og:description"
      content="Comprehensive eye exams, precision lenses, and hand-picked premium frames. Visit our store — Gaze Optics."
    />
    <meta property="og:url" content="https://minatolun-dotcom.github.io/gazeoptics/" />
    <!-- Branded 1200x630 image — swap by replacing public/og-image.jpg (see ASSETS.md) -->
    <meta property="og:image" content="https://minatolun-dotcom.github.io/gazeoptics/og-image.jpg" />
    <meta property="og:site_name" content="Gaze Optics" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Structured data: LocalBusiness / Optician -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Optician",
        "name": "Gaze Optics",
        "description": "Local optical boutique offering comprehensive eye exams, precision lenses, contact lens fitting, and hand-picked premium frames.",
        "url": "https://minatolun-dotcom.github.io/gazeoptics/",
        "hasMap": "https://maps.app.goo.gl/rYPn38XVWmwEEHqj9",
        "priceRange": "₹₹",
        "geo": { "@type": "GeoCoordinates", "latitude": 24.3326984, "longitude": 93.6943591 },
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Opposite KFC, Elim Veng",
          "addressLocality": "New Lamka",
          "addressRegion": "Manipur",
          "postalCode": "795006",
          "addressCountry": "IN"
        },
        "telephone": "+919378072478",
        "openingHours": "Mo-Sa 10:00-17:00",
        "sameAs": ["https://www.instagram.com/gaze.optics"]
      }
    </script>

    <!-- FAQ structured data — keep in sync with the FAQ section (src/components/home/Faq.tsx
         + faq content in src/content/site.ts). Answers are short and match what's shown. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Do I need an appointment for an eye test?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Walk-ins are always welcome. For eye exams and contact lens fittings we recommend booking ahead on WhatsApp so our optician can give you their full attention."
            }
          },
          {
            "@type": "Question",
            "name": "How long does a comprehensive eye test take?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Around 20–30 minutes, including a relaxed conversation about your vision needs, screen habits, and lifestyle."
            }
          },
          {
            "@type": "Question",
            "name": "Is the free eye test really free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes — your comprehensive eye test is complimentary when you have your complete glasses made at Gaze Optics."
            }
          },
          {
            "@type": "Question",
            "name": "Can you repair or adjust glasses bought elsewhere?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Absolutely. Small adjustments and nose-pad or screw fixes are done on the spot — often free. Larger repairs depend on the parts needed."
            }
          },
          {
            "@type": "Question",
            "name": "Do you fit contact lenses?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes — professional fitting with trial lenses, a follow-up, and clear care guidance so your lenses stay comfortable all day."
            }
          },
          {
            "@type": "Question",
            "name": "Where exactly is Gaze Optics located?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We are on Elim Veng in New Lamka, Churachandpur — directly opposite KFC, so you cannot miss us. Find us on Google Maps for turn-by-turn directions."
            }
          },
          {
            "@type": "Question",
            "name": "What are your opening hours?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Monday to Saturday, 10:00 AM to 5:00 PM. We are closed on Sundays — but you can still message us on WhatsApp and we will reply once we open."
            }
          },
          {
            "@type": "Question",
            "name": "How often should I get my eyes tested?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Most adults should have an eye test every one to two years — sooner if you notice changes in your vision, discomfort, or if you are over 40 or managing a condition like diabetes."
            }
          },
          {
            "@type": "Question",
            "name": "Can I get sunglasses with my prescription?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. We make prescription sunglasses with UV protection, and polarized options that cut glare — so you can see clearly and comfortably in the sun."
            }
          },
          {
            "@type": "Question",
            "name": "Can you put lenses into a frame I already own?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, we fit lenses into most frames you bring in — we will check the frame first and advise honestly if it is suitable for your prescription."
            }
          },
          {
            "@type": "Question",
            "name": "How long does it take to make my glasses?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Most single-vision glasses are ready the same day or the next day. Advanced lenses like progressive, photochromic, or high-index designs may take a few extra days — we will tell you the exact time when you order."
            }
          },
          {
            "@type": "Question",
            "name": "Do you test children's eyes?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes — we welcome children for eye exams and carry durable frames that fit young faces. It is a good idea to have kids tested before starting school and about once a year after that."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
